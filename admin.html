<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="摄影网站后台" />
    <title>摄影网站后台</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <header class="admin-header">
      <div>
        <p>Admin</p>
        <h1>摄影网站后台</h1>
      </div>
      <nav>
        <a href="index.html" target="_blank" rel="noreferrer">打开网站</a>
        <button type="button" data-logout hidden>退出登录</button>
      </nav>
    </header>

    <section class="login-panel" data-login-panel>
      <p>Admin</p>
      <h2>登录后台</h2>
      <form data-login-form>
        <label>
          <span>管理员密码</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit">登录</button>
        <p data-login-status role="status"></p>
      </form>
    </section>

    <main class="admin-shell" data-editor-shell hidden>
      <form class="editor" data-editor>
        <section class="panel">
          <div class="panel-title">
            <span>01</span>
            <h2>基本信息</h2>
          </div>
          <label>
            <span>网站姓名</span>
            <input name="name" type="text" autocomplete="name" />
          </label>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>02</span>
            <h2>作品集</h2>
          </div>
          <div class="collection-list" data-collection-list></div>
          <button class="secondary-action" type="button" data-add-collection>创建新的作品集</button>
        </section>

        <section class="panel">
          <div class="panel-title">
            <span>03</span>
            <h2>作品图片</h2>
          </div>
          <p class="panel-note">当前作品集：<strong data-current-collection>Portfolio</strong></p>
          <p class="panel-note">仅支持 JPG、PNG、WebP，单张不超过 4MB；多张图片会自动按总大小分批上传。拖动照片卡片上的 ↕ 可调整上下顺序。</p>
          <div class="photo-list" data-photo-list></div>
          <div class="inline-actions">
            <button class="secondary-action" type="button" data-add-photo>添加作品</button>
          </div>
          <div class="upload-progress" data-upload-progress hidden>
            <div class="upload-progress-label">
              <span data-upload-progress-text>正在上传 0%</span>
              <span data-upload-progress-count></span>
            </div>
            <progress value="0" max="100" data-upload-progress-bar></progress>
          </div>
          <input class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple data-photo-upload />
        </section>

        <div class="save-bar">
          <p data-status>修改会先保存在后台页面，点击保存后前台生效。</p>
          <button type="submit" data-save-button disabled>保存修改</button>
        </div>
      </form>

      <aside class="preview" aria-label="当前预览">
        <div class="preview-site">
          <header class="preview-site-sidebar">
            <strong class="preview-site-name" data-preview-name></strong>
            <nav class="preview-main-nav" data-preview-collections aria-label="预览作品集导航"></nav>
            <span class="preview-action">Random</span>
            <span class="preview-action">Darkroom</span>
          </header>
          <main class="preview-portfolio">
            <div class="preview-showcase">
              <figure class="preview-photo-frame">
                <img data-preview-image alt="后台预览图" draggable="false" />
              </figure>
              <p class="preview-description" data-preview-description hidden></p>
            </div>
            <div class="preview-slide-controls" aria-label="预览作品切换">
              <button type="button" data-preview-prev>Previous</button>
              <span>/</span>
              <button type="button" data-preview-next>Next</button>
              <span>(<span data-preview-current>0</span> of <span data-preview-total>0</span>)</span>
            </div>
          </main>
        </div>
      </aside>
    </main>

    <script src="site-config.js"></script>
    <script src="admin.js"></script>
    <script src="admin-auth.js"></script>
  </body>
</html>
